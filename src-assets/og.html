<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=block" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#f4f0e6;color:#17150f;-webkit-font-smoothing:antialiased}
.frame{position:absolute;inset:0;padding:56px 72px;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between}
.logo{display:flex;align-items:center;gap:14px}
.ring{width:30px;height:30px;border:3.5px solid #17150f;border-radius:50%;position:relative}
.ring::after{content:"";position:absolute;top:-8px;right:-5px;width:12px;height:12px;background:#3f6bff;border-radius:50%}
.word{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:26px;letter-spacing:-.02em}
.badges{display:flex;gap:10px;font-family:'IBM Plex Mono',monospace;font-size:17px}
.badges span{border:1.5px solid #17150f;border-radius:999px;padding:6px 14px}
h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:118px;line-height:.92;letter-spacing:-.025em;margin:58px 0 0;max-width:820px}
h1 em{color:#3f6bff}
.sub{font-family:'IBM Plex Sans',sans-serif;font-size:28px;line-height:1.35;margin:30px 0 0;color:#3c382e}
.bottom{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-family:'IBM Plex Mono',monospace;font-size:21px}
.post{background:#17150f;color:#f4f0e6;border-radius:12px;padding:14px 20px;box-shadow:6px 6px 0 #3f6bff}
.post b{color:#8fa6ff;font-weight:500}
.url{color:#4a463b}
.sticker{position:absolute;right:84px;top:150px;width:210px;height:210px;border:2.5px solid #17150f;border-radius:50%;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg);font-family:'IBM Plex Mono',monospace;font-size:19px;line-height:1.5;text-align:center;background:#f4f0e6}
.sticker span span{color:#3f6bff}
.band{position:absolute;left:0;right:0;bottom:0;height:10px;background:#17150f}
</style></head>
<body><div class="frame">
<div class="top"><div class="logo"><span class="ring"></span><span class="word">theloop</span></div>
<div class="badges"><span>v1.0 · contract frozen</span><span>Apache 2.0</span></div></div>
<h1>An agent loop with <em>excellent</em> amnesia.</h1>
<p class="sub">The agent loop as a stateless HTTP service. Open source.</p>
<div class="bottom"><div class="post">POST /runs <b>→ model → tools → model</b></div><div class="url">github.com/paveler/theloop</div></div>
</div>
<div class="sticker"><span>model<br>↓<br>tools<br>↓<br>model<br><span>↺ forget</span></span></div>
<div class="band"></div>
</body></html>
